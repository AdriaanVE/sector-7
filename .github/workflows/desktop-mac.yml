name: Build Mac app

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-mac-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Apple silicon app and DMG
    if: github.ref == 'refs/heads/main'
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install web and desktop dependencies
        run: |
          npm ci
          npm run desktop:setup

      - name: Check web and desktop code
        run: |
          npm run precommit
          npm run desktop:check

      - name: Build app and DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run desktop:build

      - name: Archive app with bundle permissions preserved
        run: ditto -c -k --sequesterRsrc --keepParent 'desktop/out/mac-arm64/Sector 7.app' desktop/out/Sector-7-arm64.app.zip

      - name: Upload downloadable app and DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Sector-7-mac-arm64-${{ github.sha }}
          path: |
            desktop/out/Sector-7-arm64.app.zip
            desktop/out/*.dmg
          if-no-files-found: error
          retention-days: 14
